# HomeClaw satellite for ESP32-S3-BOX-3.
#
# Flash with:
#   esphome run esphome/satellite-esp32s3-box3.yaml
#
# After first flash, the device appears as `homeclaw-<room>.local` on your
# LAN. Add it to Home Assistant via the ESPHome integration; HomeClaw will
# then route voice messages from this room through the bridge on the hub.
#
# Wake word runs ON-DEVICE using microWakeWord — no traffic to the hub
# until the wake word is recognized, minimizing network chatter.

substitutions:
  room: cucina                 # change per satellite: cucina, camera, bagno, ...
  friendly_name: HomeClaw Cucina
  hub_ip: 192.168.1.42         # IP of the HomeClaw hub (Raspberry Pi 5)

esphome:
  name: homeclaw-${room}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: top_led
          brightness: 20%
          red: 0
          green: 0
          blue: 100%

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_AUDIO_BOARD_CUSTOM: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key   # generated per device, in secrets.yaml

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:                               # fallback hotspot if Wi-Fi fails
    ssid: "HomeClaw ${room} Setup"
    password: "homeclawsetup"

captive_portal:

# -----------------------------------------------------------------------------
#  Microphone (I2S input — ESP32-S3-BOX-3 dual microphone array)
# -----------------------------------------------------------------------------
i2s_audio:
  - id: i2s_input
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO17
  - id: i2s_output
    i2s_lrclk_pin: GPIO47
    i2s_bclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    id: box_microphone
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    i2s_audio_id: i2s_input
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: box_speaker
    dac_type: external
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO15
    sample_rate: 16000
    bits_per_sample: 16bit

# -----------------------------------------------------------------------------
#  Wake word (on-device via microWakeWord)
# -----------------------------------------------------------------------------
micro_wake_word:
  vad:
  models:
    - model: hey_jarvis
    # For custom "Ehi Claw" model, train with the procedure in
    # docs/wakeword-training.md and host the .json + .tflite, then replace:
    # - model: https://your.server/ehi_claw/model.json

# -----------------------------------------------------------------------------
#  Voice assistant (points at the hub's Wyoming satellite / HA Assist)
# -----------------------------------------------------------------------------
voice_assistant:
  id: va
  microphone: box_microphone
  speaker: box_speaker
  micro_wake_word: micro_wake_word
  # noise_suppression_level 0-4, higher = more aggressive
  noise_suppression_level: 2
  # auto_gain in dBFS, -31 to 0
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  vad_threshold: 3
  on_listening:
    - light.turn_on:
        id: top_led
        brightness: 80%
        red: 0
        green: 25%
        blue: 100%
        effect: fast_pulse
  on_stt_end:
    - light.turn_on:
        id: top_led
        brightness: 80%
        red: 100%
        green: 60%
        blue: 0
  on_tts_start:
    - light.turn_on:
        id: top_led
        brightness: 80%
        red: 0
        green: 100%
        blue: 30%
  on_end:
    - delay: 1s
    - light.turn_off:
        id: top_led
  on_error:
    - light.turn_on:
        id: top_led
        brightness: 80%
        red: 100%
        green: 0
        blue: 0
    - delay: 2s
    - light.turn_off:
        id: top_led

# -----------------------------------------------------------------------------
#  Visual feedback — onboard RGB status LED
# -----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: top_led
    name: "Status LED"
    pin: GPIO39
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    effects:
      - pulse:
          name: fast_pulse
          transition_length: 200ms
          update_interval: 200ms

# -----------------------------------------------------------------------------
#  Physical mute switch (front-panel button on ESP32-S3-BOX-3)
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: mute_button
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - voice_assistant.stop:
      - light.turn_off:
          id: top_led

# -----------------------------------------------------------------------------
#  Diagnostics exposed in HA (useful for Tier C troubleshooting)
# -----------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
